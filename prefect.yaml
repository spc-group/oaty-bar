---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: oaty-bar
prefect-version: 3.7.1

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /home/mwolf/src/oaty-bar

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: export
  version: "1"
  tags: []
  description: "Export files for runs from Tiled."
  schedule: {}
  flow_name: "export-run"
  entrypoint: "src/oaty_bar/_export_run.py:export_run"
  parameters: {}
  work_pool:
    name: "gdata"
    work_queue_name: null
    job_variables: {}
- name: fit-xrf
  version: "1"
  tags: []
  description: "Fit fluorescence data from Bluesky runs."
  schedule: {}
  flow_name: "fit-fluorescence"
  entrypoint: "src/oaty_bar/_fit_fluorescence.py:fit_fluorescence"
  parameters: {}
  work_pool:
    name: "compute"
    work_queue_name: null
    job_variables: {}
- name: backup-databases
  version: "1"
  tags: []
  description: "Dump critical databases from SQL to disk."
  schedule: {}
  flow_name: "backup-databases"
  entrypoint: "src/oaty_bar/_backup_databases.py:backup_databases"
  parameters: {}
  work_pool:
    name: "gdata"
    work_queue_name: null
    job_variables: {}
