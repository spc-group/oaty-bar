---
# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: oaty-bar
prefect-version: 3.7.1

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project
# is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: "{{ $HOME }}/src/oaty-bar"

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: prepare-data-storage
  version: "1"
  tags: []
  description: "Prepare a folder, DAQ, skeleton files, etc for a DM experiment."
  schedule: {}
  flow_name: "prepare-data-storage"
  entrypoint: "src/oaty_bar/_data_storage.py:prepare_data_storage"
  parameters: {}
  work_pool:
    name: "gdata"
    work_queue_name: null
    job_variables: {}
- name: process-run
  version: "1"
  tags: []
  description: "Process a raw Bluesky run in Tiled (e.g. fit flourescence, etc.)."
  schedule: {}
  flow_name: "process-run"
  entrypoint: "src/oaty_bar/_process_run.py:process_run"
  parameters: {}
  work_pool:
    name: "compute"
    work_queue_name: null
    job_variables: {}
- name: export
  version: "2"
  tags: []
  description: "Export files for runs from Tiled."
  schedule: {}
  flow_name: "export-run"
  entrypoint: "src/oaty_bar/_export_run.py:export_run"
  parameters: {}
  work_pool:
    name: "gdata"
    work_queue_name: null
    job_variables: {}
- name: fit-xrf
  version: "1"
  tags: []
  description: "Fit fluorescence data from Bluesky runs."
  schedule: {}
  flow_name: "fit-fluorescence"
  entrypoint: "src/oaty_bar/_fit_fluorescence.py:fit_fluorescence"
  parameters: {}
  work_pool:
    name: "compute"
    work_queue_name: null
    job_variables: {}
- name: backup-databases
  version: "1"
  tags: []
  description: "Dump critical databases from SQL to disk."
  schedule: {}
  flow_name: "backup-databases"
  entrypoint: "src/oaty_bar/_backup_databases.py:backup_databases"
  parameters: {}
  work_pool:
    name: "gdata"
    work_queue_name: null
    job_variables: {}
automations:
- name: Notify Failed Bluesky Run @ 25-ID-C
  description: Notify beamline staff when a bluesky run fails at 25-ID-C
  enabled: true
  tags: []
  trigger:
    type: event
    match:
      aps.beamline.id:
      - 25-ID-C
      prefect.resource.id:
      - oaty-bar.dispatcher.*
    match_related: {}
    after: []
    expect:
    - bluesky.run.fail
    for_each: []
    posture: Reactive
    threshold: 1
    within: 60.0
  actions:
  - type: send-notification
    block_document_id: 5824cb50-c7bd-4cc8-abb9-559968f279d9
    subject: A Bluesky run failed
    body: "Reason: {{ event.payload.metadata.stop.reason }}\n\nRun Details:\n  UID:\
      \ {{ event.payload.metadata.start.uid }}\n  Beamline: {{ event.payload.metadata.start.beamline_id\
      \ }}\n  Scan name: {{ event.payload.metadata.start.scan_name }}"
  actions_on_trigger: []
  actions_on_resolve: []
  owner_resource: null
  id: 1a169cb9-9376-461f-aa3f-112cce68246b
- name: Notify Failed Bluesky Run @ 25-ID-D
  description: Notify beamline staff when a bluesky run fails at 25-ID-D
  enabled: true
  tags: []
  trigger:
    type: event
    match:
      aps.beamline.id:
      - 25-ID-D
      prefect.resource.id:
      - oaty-bar.dispatcher.*
    match_related: {}
    after: []
    expect:
    - bluesky.run.fail
    for_each: []
    posture: Reactive
    threshold: 1
    within: 60.0
  actions:
  - type: send-notification
    block_document_id: 6878cb0f-6536-49f8-bbd1-5ca1a8a5fec2
    subject: A Bluesky run failed
    body: "Reason: {{ event.payload.metadata.stop.reason }}\n\nRun Details:\n  UID:\
      \ {{ event.payload.metadata.start.uid }}\n  Beamline: {{ event.payload.metadata.start.beamline_id\
      \ }}\n  Scan name: {{ event.payload.metadata.start.scan_name }}"
  actions_on_trigger: []
  actions_on_resolve: []
  owner_resource: null
  id: 1f92c165-bfa1-4512-a192-d03317b14b0b
