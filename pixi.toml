[workspace]
authors = ["Mark Wolfman <wolfman@anl.gov>"]
channels = ["conda-forge"]
name = "oaty-bar"
platforms = ["linux-64"]

[tasks]
tiled-server = "uvicorn tiled.server.app:app"
prefect-server = "prefect server start"

[dependencies]
python = ">=3.14.4,<3.15"
postgresql = ">=17.0,<18"
valkey-server = ">=9.1.0,<10"

[pypi-dependencies]
oaty-bar = { path = ".", editable = true }
tiled = { version = ">=0.2.10, <0.3", extras = ["all"] }
h5py = ">=3.16.0, <4"
hdf5plugin = ">=6.0.0, <7"
bluesky-tiled-plugins = ">=2.0.2, <3"
# xraydb = { path = "../XrayDB/python", editable = true }
xraydb = { git = "https://github.com/spc-group/XrayDB.git", subdirectory = "python", branch="thread-safety" }
xraylarch = ">=2026.1.2, <2027"
chemformula = ">=1.5.1, <2"
peakutils = ">=1.3.5, <2"
pybaselines = ">=1.2.1, <2"
pint = ">=0.25.3, <0.26"
# dmax  = { path = "../dmax", editable = true }
dmax = ">=0.0.8, <0.1.0"
prefect = { version = ">=3.7.1, <4", extras = ["sqlalchemy", "slack"] }
platformdirs = ">=4.9.6, <5"

[environments]
dev = { features = ["dev"] }

[activation.env]
PREFECT_SERVER_ANALYTICS_ENABLED="false"

[feature.dev.dependencies]

[feature.dev.pypi-dependencies]
pytest = ">=9.0.3"
ruff = ">=0.15.11, <0.16"
black = ">=26.3.1, <27"
isort = ">=8.0.1, <9"
mypy = ">=1.20.2, <2"
sphinx = ">=9.1.0, <10"
sphinx-rtd-theme = ">=3.1.0, <4"
pytest-asyncio = ">=1.3.0, <2"
nexusformat = ">=2.0.2, <3"
pytest-mock = ">=3.15.1, <4"
ipython = ">=9.12.0, <10"
matplotlib = ">=3.10.9, <4"
pytest-timeout = ">=2.4.0, <3"

[feature.dev.tasks]
test-all = [
    {task = "lint" },
    {task = "format", args = ["--check"] },
    {task = "sort-imports", args = ["--check"] },
    {task = "check-types" },
    {task = "tests" },
]
lint-all = [
    {task = "lint", args = ["--fix"]},
    {task = "format"},
    {task = "sort-imports"},
]
check-types = "mypy"
make-docs = "make html --directory=docs/"
tests = "pytest"

[feature.dev.tasks.lint]
args = [
     { arg = "fix", default = "" },
]
cmd = "ruff check {{ fix }}"

[feature.dev.tasks.sort-imports]
args = [
     { arg = "check_flag", default = "" },
]
cmd = "isort src/ tests/ {{ check_flag }}"

[feature.dev.tasks.format]
args = [
     { arg = "check_flag", default = "" },
]
cmd = "black src/ tests/ {{ check_flag }}"
